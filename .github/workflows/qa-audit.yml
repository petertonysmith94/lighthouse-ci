# QA Audit — Runs on Vercel preview deployments
#
# Copy this workflow to the WEBSITE repo (not plasma-qa-tools).
# It triggers when Vercel finishes deploying a preview, runs multi-page
# QA audits, and posts results as a PR comment.
#
# Required secrets:
#   VERCEL_PREVIEW_PASSWORD  — password for Vercel preview protection
#
# Optional secrets:
#   PSI_API_KEY              — Google PageSpeed Insights API key for CrUX field data

name: QA Audit

on:
  deployment_status:

# Cancel in-progress runs for the same deployment
concurrency:
  group: qa-audit-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  audit:
    # Only run on successful non-production deployments
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout plasma-qa-tools
        uses: actions/checkout@v4
        with:
          repository: nicholasgriffintn/plasma-qa-tools
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Extract preview URL
        id: preview
        run: |
          echo "url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${{ github.event.deployment_status.target_url }}"

      - name: Run site audit
        id: audit
        env:
          VERCEL_PREVIEW_PASSWORD: ${{ secrets.VERCEL_PREVIEW_PASSWORD }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          node scripts/site-audit.js "${{ steps.preview.outputs.url }}" \
            --password "$VERCEL_PREVIEW_PASSWORD" \
            ${PSI_API_KEY:+--psi-api-key "$PSI_API_KEY"} \
            --ci \
            --ci-summary summary.md \
            --ci-comment comment.md \
            --save || echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find associated PR
        if: always() && steps.audit.outcome != 'skipped'
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.deployment.sha }}"
          PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls \
            --jq ".[] | select(.head.sha == \"${SHA}\") | .number" \
            2>/dev/null | head -1)
          if [ -n "$PR_NUMBER" ]; then
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Found PR #$PR_NUMBER"
          else
            echo "No PR found for SHA $SHA"
          fi

      - name: Post or update PR comment
        if: always() && steps.find-pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.number }}"

          if [ ! -f comment.md ]; then
            echo "No comment.md found, skipping"
            exit 0
          fi

          # Find existing bot comment
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## "))) | .id' \
            2>/dev/null | head -1)

          if [ -n "$COMMENT_ID" ]; then
            # Update existing comment
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              --method PATCH \
              --field body=@comment.md
            echo "Updated comment $COMMENT_ID on PR #$PR_NUMBER"
          else
            # Create new comment
            gh pr comment "$PR_NUMBER" --body-file comment.md
            echo "Created new comment on PR #$PR_NUMBER"
          fi

      - name: Upload report artifacts
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-report
          path: |
            reports/
            summary.md
            comment.md
          retention-days: 14

      - name: Set exit code
        if: steps.audit.outputs.exit_code
        run: exit ${{ steps.audit.outputs.exit_code }}
